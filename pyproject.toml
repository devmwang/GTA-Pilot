[project]
name = "gtapilot"
version = "0.1.0"
description = ""
authors = [{ name = "Michael Wang", email = "41971562+devmwang@users.noreply.github.com" }]
requires-python = ">=3.13,<3.15"
readme = "README.md"
dependencies = [
    "comtypes==1.4.16",
    "numpy==2.4.4",
    "opencv-python==4.13.0.92",
    "pyzmq==27.1.0",
    "setproctitle==1.3.7",
    "torch>=2.11.0,<2.12.0",
    "torchvision>=0.26.0,<0.27.0",
]

[project.urls]
Repository = "https://github.com/devmwang/GTAP"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ty.src]
exclude = ["gpt-pro/", "gtapilot/external/json/tools/"]
