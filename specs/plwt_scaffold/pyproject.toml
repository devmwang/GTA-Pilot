[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plwt-scaffold"
version = "0.1.0"
description = "Photon -> Latent World -> Trajectory scaffold for GTA Pilot"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1"
]

[tool.setuptools.packages.find]
include = ["plwt*"]
